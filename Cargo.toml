[package]
name = "lekalo-target-python"
version = "0.1.1"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Observed Python symbol scanner for the lekalo.target/v1 process protocol (issue #146). Read-only static analysis: no Python execution, no imports, no network."
repository = "https://github.com/ichinya/lekalo-python"
publish = false

[dependencies]
lekalo-python-fastapi = { git = "https://github.com/ichinya/lekalo-python-fastapi", rev = "f457ae75e1a425cfa4e9765ca949bed41574e09d" }
lekalo-python-fastmcp = { git = "https://github.com/ichinya/lekalo-python-fastmcp", rev = "cca239c5bd4fcd1a76f6f292d8b75f8ccdfcb2be" }
lekalo-adapter-sdk-rust = { git = "https://github.com/ichinya/lekalo-adapter-sdk", rev = "92263c8e4cac9cbfbb38bdab44da71a41d001f20" }
# Ruff's AST, parser and source-coordinate types form one release set.
ruff_python_ast = "=0.0.22"
ruff_python_parser = "=0.0.22"
ruff_source_file = "=0.0.22"
ruff_text_size = "=0.0.22"
sha2 = "0.11"

[[bin]]
name = "lekalo-target-python"
path = "src/main.rs"

[workspace]
